<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="certBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <linearGradient id="certMint" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="goldRibbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Certificate Canvas -->
  <rect width="600" height="400" rx="16" fill="url(#certBg)" stroke="#e2e8f0" stroke-width="2" />

  <!-- Elegant Inner Border -->
  <rect x="24" y="24" width="552" height="352" rx="10" fill="none" stroke="#10b981" stroke-width="2" stroke-dasharray="6 4" opacity="0.4" />
  <rect x="32" y="32" width="536" height="336" rx="8" fill="none" stroke="#059669" stroke-width="1" opacity="0.2" />

  <!-- Corner Flourishes -->
  <path d="M40 56 L56 40 M40 68 L68 40" stroke="#10b981" stroke-width="1.5" stroke-linecap="round" />
  <path d="M560 56 L544 40 M560 68 L532 40" stroke="#10b981" stroke-width="1.5" stroke-linecap="round" />
  <path d="M40 344 L56 360 M40 332 L68 360" stroke="#10b981" stroke-width="1.5" stroke-linecap="round" />
  <path d="M560 344 L544 360 M560 332 L532 360" stroke="#10b981" stroke-width="1.5" stroke-linecap="round" />

  <!-- Badge / Ribbon -->
  <g transform="translate(300, 100)" filter="url(#cardShadow)">
    <circle cx="0" cy="0" r="36" fill="url(#goldRibbon)" />
    <circle cx="0" cy="0" r="28" fill="#ffffff" />
    <path d="M-10 6 L0 -14 L10 6 L-16 -2 L16 -2 Z" fill="#d97706" />
    <!-- Ribbon tails -->
    <path d="M-14 26 L-24 54 L-12 46 L0 54 L-6 28 Z" fill="#d97706" opacity="0.9" />
    <path d="M14 26 L24 54 L12 46 L0 54 L6 28 Z" fill="#b45309" opacity="0.9" />
  </g>

  <!-- Typography -->
  <text x="300" y="175" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#059669" letter-spacing="3">
    CERTIFICATE OF ACHIEVEMENT
  </text>
  
  <text x="300" y="215" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800" fill="#0f172a">
    Full Stack Web Development
  </text>
  
  <text x="300" y="245" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400" fill="#64748b">
    Awarded for demonstrated excellence in building modern web applications
  </text>

  <!-- Divider Line -->
  <line x1="220" y1="270" x2="380" y2="270" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" />

  <!-- Verification note -->
  <text x="300" y="320" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#10b981">
    VERIFIED CREDENTIAL • 2026
  </text>
</svg>
