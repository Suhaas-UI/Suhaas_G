<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="mintGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ecfdf5" />
      <stop offset="100%" stop-color="#d1fae5" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#059669" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Background Circle -->
  <rect width="400" height="400" rx="200" fill="url(#bgGrad)" />

  <!-- Outer Ring Accent -->
  <circle cx="200" cy="200" r="185" fill="none" stroke="url(#mintGrad)" stroke-width="6" stroke-dasharray="8 8" opacity="0.6" />

  <!-- Avatar Silhouette / Graphic -->
  <g filter="url(#softShadow)">
    <!-- Head -->
    <circle cx="200" cy="160" r="65" fill="url(#mintGrad)" />
    
    <!-- Torso / Shoulders -->
    <path d="M110 320 C110 240, 150 220, 200 220 C250 220, 290 240, 290 320 Z" fill="url(#mintGrad)" opacity="0.9" />
  </g>

  <!-- Friendly Accent badge -->
  <g transform="translate(265, 255)">
    <circle cx="25" cy="25" r="28" fill="#ffffff" filter="url(#softShadow)" />
    <circle cx="25" cy="25" r="22" fill="#10b981" />
    <path d="M17 25 L23 31 L33 19" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Text hint -->
  <text x="200" y="365" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#047857" letter-spacing="1">
    REPLACE WITH YOUR PHOTO
  </text>
</svg>
