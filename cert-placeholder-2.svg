<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="certBg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f0fdf4" />
    </linearGradient>
    <linearGradient id="mintAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="certShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#059669" flood-opacity="0.1" />
    </filter>
  </defs>

  <!-- Certificate Canvas -->
  <rect width="600" height="400" rx="16" fill="url(#certBg2)" stroke="#a7f3d0" stroke-width="2" />

  <!-- Elegant Inner Border -->
  <rect x="24" y="24" width="552" height="352" rx="10" fill="none" stroke="#059669" stroke-width="2" stroke-dasharray="8 4" opacity="0.35" />
  <rect x="32" y="32" width="536" height="336" rx="8" fill="none" stroke="#10b981" stroke-width="1" opacity="0.2" />

  <!-- Ribbon Badge -->
  <g transform="translate(300, 100)" filter="url(#certShadow)">
    <circle cx="0" cy="0" r="36" fill="url(#mintAccent)" />
    <circle cx="0" cy="0" r="28" fill="#ffffff" />
    <path d="M-12 -6 L-2 4 L12 -10" fill="none" stroke="#059669" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Ribbon tails -->
    <path d="M-14 26 L-24 54 L-12 46 L0 54 L-6 28 Z" fill="#059669" opacity="0.9" />
    <path d="M14 26 L24 54 L12 46 L0 54 L6 28 Z" fill="#047857" opacity="0.9" />
  </g>

  <!-- Typography -->
  <text x="300" y="175" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#059669" letter-spacing="3">
    PROFESSIONAL SPECIALIZATION
  </text>
  
  <text x="300" y="215" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800" fill="#0f172a">
    UI/UX Design & Frontend Systems
  </text>
  
  <text x="300" y="245" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400" fill="#64748b">
    Mastery of responsive interfaces, component architectures, and accessibility
  </text>

  <!-- Divider Line -->
  <line x1="220" y1="270" x2="380" y2="270" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" />

  <!-- Verification note -->
  <text x="300" y="320" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#059669">
    OFFICIAL CERTIFICATION • 2026
  </text>
</svg>
