<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="certBg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f0fdf4" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="shadow3" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0d9488" flood-opacity="0.1" />
    </filter>
  </defs>

  <!-- Certificate Canvas -->
  <rect width="600" height="400" rx="16" fill="url(#certBg3)" stroke="#99f6e4" stroke-width="2" />

  <!-- Elegant Inner Border -->
  <rect x="24" y="24" width="552" height="352" rx="10" fill="none" stroke="#0d9488" stroke-width="2" stroke-dasharray="6 4" opacity="0.35" />
  <rect x="32" y="32" width="536" height="336" rx="8" fill="none" stroke="#14b8a6" stroke-width="1" opacity="0.2" />

  <!-- Ribbon Badge -->
  <g transform="translate(300, 100)" filter="url(#shadow3)">
    <circle cx="0" cy="0" r="36" fill="url(#tealGrad)" />
    <circle cx="0" cy="0" r="28" fill="#ffffff" />
    <!-- Star Icon -->
    <path d="M0 -15 L4 -4 L15 -4 L7 3 L10 14 L0 7 L-10 14 L-7 3 L-15 -4 L-4 -4 Z" fill="#0d9488" />
    <!-- Ribbon tails -->
    <path d="M-14 26 L-24 54 L-12 46 L0 54 L-6 28 Z" fill="#0d9488" opacity="0.9" />
    <path d="M14 26 L24 54 L12 46 L0 54 L6 28 Z" fill="#0f766e" opacity="0.9" />
  </g>

  <!-- Typography -->
  <text x="300" y="175" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#0d9488" letter-spacing="3">
    ADVANCED ACCREDITATION
  </text>
  
  <text x="300" y="215" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800" fill="#0f172a">
    Cloud Architecture &amp; APIs
  </text>
  
  <text x="300" y="245" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400" fill="#64748b">
    Proficiency in microservices, secure cloud deployment, and system scaling
  </text>

  <!-- Divider Line -->
  <line x1="220" y1="270" x2="380" y2="270" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" />

  <!-- Verification note -->
  <text x="300" y="320" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#0d9488">
    VERIFIED SPECIALIZATION • 2026
  </text>
</svg>
